[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-musnim"
version = "0.1.0a0"
description = "Open musical visualization tools for Manim Community"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Musnim contributors"}]
dependencies = ["manim>=0.22,<0.23", "numpy>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
