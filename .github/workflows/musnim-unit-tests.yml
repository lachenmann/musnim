name: Musnim unit tests

on:
  push:
    paths:
      - "extensions/musnim/**"
      - "projects/ZAR-001/**"
      - ".github/workflows/musnim-unit-tests.yml"
  pull_request:
    paths:
      - "extensions/musnim/**"
      - "projects/ZAR-001/**"
      - ".github/workflows/musnim-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musnim-unit-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e ./extensions/musnim
          python -m pip install "pytest>=8" "numpy>=2.1"
      - name: Check PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @("scripts/bootstrap_windows.ps1", "scripts/render_musnim.ps1")
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          }
      - name: Run Musnim unit tests
        run: python -m pytest -c extensions/musnim/pyproject.toml extensions/musnim/tests -q
# Render validation will require LilyPond, LaTeX, FFmpeg and Manim.
